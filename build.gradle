plugins {
	// Minecraft 1.21 要求 Java 21。
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 官方仓库优先，避免 GitHub Actions 上 BMCLAPI 的 503 重定向拖垮构建。
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
	// 国内网络的后备镜像；官方仓库找不到时才查询。
	maven {
		name = 'BMCLAPI'
		url = 'https://bmclapi2.bangbang93.com/maven'
	}
}

loom {
	// 与 IDEA 中“拆分客户端与共同来源”保持一致：src/main 为 common，src/client 为 client。
	splitEnvironmentSourceSets()

	mods {
		"pinyinsearch" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// 严格使用 1.21 + Yarn。
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// 本模组是纯客户端 Mixin，不需要 Fabric API 或其他第三方库。
}

// 不在这里做 processResources 动态过滤。
// IDEA 对 filesMatching + expand 的 CopyAction 解析不完整，会报
// "Cannot resolve resource filtering of MatchingCopyAction"。
// fabric.mod.json 里使用固定版本号，升级时同步修改 mod_version 和该文件即可。

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// 发布仓库按需填写。
	}
}

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric / Minecraft —— 严格锁定 1.21.4
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.10
loom_version=1.10.5

# Loom 的版本清单走 BMCLAPI；资源文件保留官方地址。
# 实测 BMCLAPI 的 /assets 在并发下载时会出现 TLS 握手重置，
# 因此不要覆盖 loom_resources_base，否则 runClient 的 downloadAssets 会失败。
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json

# Mod
mod_version=1.0.0+mc1.21.4
maven_group=com.pinyinsearch
archives_base_name=pinyinsearch

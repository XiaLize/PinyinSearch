# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric / Minecraft —— 严格锁定 1.20.1
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.10
loom_version=1.7.4

# Loom 的 Minecraft 资源 / 版本清单走 BMCLAPI。
# 这两个键是 Loom 的 extra property，不能改成 Kotlin DSL。
# 注意：不覆盖 loom_libraries_base，BMCLAPI 对部分 Mojang 库的 302 跳转
# 会让 Gradle 的 HEAD 请求返回 403，反而导致依赖解析失败。
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json

# Mod
mod_version=1.0.0
maven_group=com.pinyinsearch
archives_base_name=pinyinsearch
